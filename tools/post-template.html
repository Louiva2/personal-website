<!DOCTYPE html>
<!-- Generated by tools/build-posts.mjs from js/posts.js and tools/post-template.html. Edit those, then rerun it. -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FDCDCD" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#471F28" media="(prefers-color-scheme: dark)">
  <title>{{title}} · Yihua Liu</title>
  <meta name="description" content="{{summary}}">
  <link rel="canonical" href="{{url}}">
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{summary}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:site_name" content="Yihua Liu">
  <meta property="og:locale" content="zh_CN">
  <meta property="article:published_time" content="{{date}}">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <script>
    // Fetch the post now instead of after marked and KaTeX download; js/site.js picks it up.
    // The slug is written in when the page is generated, after the generator checks it.
    (function () {
      var response = fetch("../../posts/{{slug}}.md");
      response.catch(function () {});
      globalThis.SITE_POST_FETCH = { slug: "{{slug}}", response: response };
    })();
  </script>
  <link rel="preload" href="../../assets/katex/fonts/KaTeX_Main-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../../assets/katex/fonts/KaTeX_Math-Italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../../css/site.css">
  <link rel="stylesheet" href="../../assets/katex/katex.min.css">
</head>
<body>
  <a class="skip" href="#content">跳到正文</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="site-name" href="../../">Yihua Liu</a>
      <nav aria-label="站点">
        <a href="../../">首页</a>
        <a href="../" aria-current="page">笔记</a>
        <a href="../../projects/">项目</a>
      </nav>
    </div>
  </header>
  <main id="content" class="wrap">
    <article data-article data-slug="{{slug}}" aria-busy="true">
      <p class="deck">正在读这篇笔记…</p>
    </article>
    <noscript>
      <p>笔记需要 JavaScript 才能把 Markdown 和公式排出来。也可以直接阅读源文件 <a href="../../posts/{{slug}}.md"><code>posts/{{slug}}.md</code></a>。</p>
    </noscript>
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>© 2026 Yihua Liu. 代码保留所有权利 · 文章采用 <a href="https://creativecommons.org/licenses/by-nc/4.0/">CC BY-NC 4.0</a></p>
    </div>
  </footer>
  <script src="../../assets/marked/marked.umd.js" defer></script>
  <script src="../../assets/katex/katex.min.js" defer></script>
  <script src="../../js/posts.js" defer></script>
  <script src="../../js/render.js" defer></script>
  <script src="../../js/site.js" defer></script>
</body>
</html>
