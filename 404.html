<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FDCDCD">
  <title>找不到这一页 · Yihua Liu</title>
  <link rel="icon" href="/personal-website/favicon.svg" type="image/svg+xml" data-path="favicon.svg">
  <style>
    :root {
      --pink: #FDCDCD;
      --paper: #FFF1EE;
      --paper-bottom: #FFE4DE;
      --ink: #3B2424;
      --link: #A33D52;
      --link-hover: #9C4338;
      --mark: #D07080;
      color-scheme: light;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(to bottom, var(--paper), var(--paper-bottom));
      background-attachment: fixed;
      color: var(--ink);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Songti SC", "STSong", "SimSun", serif;
      font-size: 1.125rem;
      line-height: 1.85;
    }
    header, footer { background: var(--pink); }
    .inner { width: min(42rem, 100%); margin: 0 auto; padding: 1.05rem 1.5rem; }
    main.inner { flex: 1; padding-top: 3.5rem; padding-bottom: 2.5rem; }
    a { color: var(--link); }
    a:hover { color: var(--link-hover); }
    h1 { font-size: 1.75rem; font-weight: 600; line-height: 1.4; margin: 0 0 0.75rem; }
    h1::after {
      content: "";
      display: block;
      width: 2.15rem;
      height: 2px;
      margin-top: 0.4rem;
      background: var(--mark);
    }
    p { margin: 0 0 1.2em; }
    header .inner {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem 1.5rem;
    }
    header a { color: var(--ink); text-decoration: none; }
    header a:hover { color: var(--link-hover); }
    nav { display: flex; flex-wrap: wrap; gap: 1.15rem; }
    .name { font-weight: 600; }
    footer .inner { padding-bottom: 1.15rem; }
    footer p { margin: 0; }
    footer a { color: var(--link-hover); }
  </style>
</head>
<body>
  <header>
    <div class="inner">
      <a class="name" href="/personal-website/" data-path="">Yihua Liu</a>
      <nav aria-label="站点">
        <a href="/personal-website/" data-path="">首页</a>
        <a href="/personal-website/blog/" data-path="blog/">笔记</a>
        <a href="/personal-website/projects/" data-path="projects/">项目</a>
      </nav>
    </div>
  </header>
  <main class="inner">
    <h1>找不到这一页</h1>
    <p>这个地址没有对应的页面。</p>
    <p><a href="/personal-website/" data-path="">回首页</a></p>
  </main>
  <footer>
    <div class="inner">
      <p>© 2026 Yihua Liu. 代码保留所有权利 · 文章采用 <a href="https://creativecommons.org/licenses/by-nc/4.0/">CC BY-NC 4.0</a></p>
    </div>
  </footer>
  <script>
    // Root-absolute links work at any depth on GitHub Pages. Outside /personal-website/
    // (a local preview from the repo root), point them at the server root instead.
    (function () {
      var home = location.pathname.indexOf("/personal-website/") === 0 ? "/personal-website/" : "/";
      var links = document.querySelectorAll("[data-path]");
      for (var i = 0; i < links.length; i++) {
        links[i].href = home + links[i].getAttribute("data-path");
      }
    })();
  </script>
</body>
</html>
