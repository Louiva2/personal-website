<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FDCDCD">
  <title>找不到这一页 · Yihua Liu</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --pink: #FDCDCD;
      --paper: #FFF1EE;
      --paper-bottom: #FFE4DE;
      --ink: #3B2424;
      --link: #A33D52;
      --link-hover: #9C4338;
      --mark: #D07080;
      color-scheme: light;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(to bottom, var(--paper), var(--paper-bottom));
      background-attachment: fixed;
      color: var(--ink);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Songti SC", "STSong", "SimSun", serif;
      font-size: 1.125rem;
      line-height: 1.85;
    }
    header, footer { background: var(--pink); }
    .inner { width: min(42rem, 100%); margin: 0 auto; padding: 1.05rem 1.5rem; }
    main.inner { flex: 1; padding-top: 3.5rem; padding-bottom: 2.5rem; }
    a { color: var(--link); }
    a:hover { color: var(--link-hover); }
    h1 { font-size: 1.75rem; font-weight: 600; line-height: 1.4; margin: 0 0 0.75rem; }
    h1::after {
      content: "";
      display: block;
      width: 2.15rem;
      height: 2px;
      margin-top: 0.4rem;
      background: var(--mark);
    }
    p { margin: 0 0 1.2em; }
    .name { color: var(--ink); font-weight: 600; text-decoration: none; }
    .name:hover { color: var(--link-hover); }
    footer .inner { padding-bottom: 1.15rem; }
    footer p { margin: 0; }
    footer a { color: var(--link-hover); }
  </style>
</head>
<body>
  <header>
    <div class="inner">
      <a class="name" id="brand" href="/personal-website/">Yihua Liu</a>
    </div>
  </header>
  <main class="inner">
    <h1>找不到这一页</h1>
    <p>这个地址没有对应的页面。</p>
    <p><a id="home" href="/personal-website/">回首页</a></p>
  </main>
  <footer>
    <div class="inner">
      <p>© 2026 Yihua Liu. 代码保留所有权利 · 文章采用 <a href="https://creativecommons.org/licenses/by-nc/4.0/">CC BY-NC 4.0</a></p>
    </div>
  </footer>
  <script>
    (function () {
      var home = location.pathname.indexOf("/personal-website/") === 0 ? "/personal-website/" : "/";
      document.getElementById("home").href = home;
      document.getElementById("brand").href = home;
    })();
  </script>
</body>
</html>
