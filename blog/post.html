<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FDCDCD" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#471F28" media="(prefers-color-scheme: dark)">
  <title>笔记 · Yihua Liu</title>
  <meta name="description" content="Yihua Liu 的一篇笔记。">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <script>
    // Fetch the post now instead of after marked and KaTeX download; js/site.js picks it up.
    // Same slug rule as js/site.js. Keep the two identical: the rule confines the fetch, and
    // the HTML rendered from it, to posts/.
    (function () {
      var slug = new URLSearchParams(location.search).get("p") || "";
      if (!/^[a-z0-9-]+$/.test(slug)) return;
      var response = fetch("../posts/" + slug + ".md");
      response.catch(function () {});
      globalThis.SITE_POST_FETCH = { slug: slug, response: response };
    })();
  </script>
  <link rel="preload" href="../assets/katex/fonts/KaTeX_Main-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../assets/katex/fonts/KaTeX_Math-Italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../css/site.css">
  <link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
  <a class="skip" href="#content">跳到正文</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="site-name" href="../">Yihua Liu</a>
      <nav aria-label="站点">
        <a href="../">首页</a>
        <a href="./" aria-current="page">笔记</a>
        <a href="../projects/">项目</a>
      </nav>
    </div>
  </header>
  <main id="content" class="wrap">
    <article data-article aria-busy="true">
      <p class="deck">正在读这篇笔记…</p>
    </article>
    <noscript>
      <p>笔记需要 JavaScript 才能把 Markdown 和公式排出来。也可以直接阅读 <code>posts/</code> 里的源文件。</p>
    </noscript>
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>© 2026 Yihua Liu. 代码保留所有权利 · 文章采用 <a href="https://creativecommons.org/licenses/by-nc/4.0/">CC BY-NC 4.0</a></p>
    </div>
  </footer>
  <script src="../assets/marked/marked.umd.js" defer></script>
  <script src="../assets/katex/katex.min.js" defer></script>
  <script src="../js/posts.js" defer></script>
  <script src="../js/render.js" defer></script>
  <script src="../js/site.js" defer></script>
</body>
</html>
